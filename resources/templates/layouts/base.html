<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title | default(app_name) }}{% endblock %} — {{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/site.css') }}">
    <style>:root { --nt-primary: #1677ff; }</style>
    {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}
    <script src="{{ url_for('static', path='js/site.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
