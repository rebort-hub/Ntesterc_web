{% extends "layouts/admin.html" %}

{% block admin_page_extra_head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/icon-picker.css') }}">
{% endblock %}

{% block content %}
<form class="form-card" method="post" action="{{ form_action }}">
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <label>
        <span>父级权限</span>
        <select name="parent_id">
            <option value="">无</option>
            {% for opt in parent_options %}
            {% if not perm_obj or opt.id != perm_obj.id %}
            <option value="{{ opt.id }}" {% if perm_obj and perm_obj.parent_id == opt.id %}selected{% endif %}>{{ opt.name }} ({{ opt.code }})</option>
            {% endif %}
            {% endfor %}
        </select>
    </label>
    <label>
        <span>权限名称</span>
        <input name="name" required value="{{ perm_obj.name if perm_obj else '' }}">
    </label>
    <label>
        <span>权限编码</span>
        <input name="code" required value="{{ perm_obj.code if perm_obj else '' }}">
    </label>
    <label>
        <span>类型</span>
        <select name="type" required>
            {% for t in permission_types %}
            <option value="{{ t }}" {% if perm_obj and perm_obj.type == t %}selected{% elif not perm_obj and t == 'menu' %}selected{% endif %}>{{ type_labels.get(t, t) if type_labels is defined else t }}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        <span>路径 / 路由</span>
        <input name="path" value="{{ perm_obj.path if perm_obj and perm_obj.path else '' }}" placeholder="/admin/...">
    </label>
    <label>
        <span>打开方式</span>
        <select name="open_type">
            {% for ot in open_types %}
            <option value="{{ ot }}" {% if perm_obj and perm_obj.open_type == ot %}selected{% elif not perm_obj and ot == '_self' %}selected{% endif %}>{{ open_type_labels.get(ot, ot) if open_type_labels is defined else ot }}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        <span>图标</span>
        <input name="icon" data-nt-icon-picker value="{{ perm_obj.icon if perm_obj and perm_obj.icon else '' }}" placeholder="点击选择图标">
    </label>
    <label>
        <span>排序</span>
        <input type="number" name="sort_order" value="{{ perm_obj.sort_order if perm_obj else 0 }}">
    </label>
    <label>
        <span>状态</span>
        <span class="nt-check">
            <input type="checkbox" name="is_enabled" value="1" {% if not perm_obj or perm_obj.is_enabled %}checked{% endif %}>
            启用
        </span>
    </label>
    <label>
        <span>说明</span>
        <textarea name="description" rows="3">{{ perm_obj.description if perm_obj and perm_obj.description else '' }}</textarea>
    </label>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">保存</button>
        <a class="btn" href="{{ list_url if list_url is defined else '/admin/system/permissions' }}">返回</a>
    </div>
</form>
{% endblock %}

{% block admin_page_scripts %}
<script src="{{ url_for('static', path='js/icon-picker.js') }}?v=6" defer></script>
{% endblock %}
