[APP]
APP_NAME = NtestercWeb
DEBUG = True
SECRET_KEY = your-secret-key-here
ALLOWED_HOSTS = localhost,127.0.0.1

[WEB]
# 服务端渲染页面（前后端不分离）
ENABLED = True
# 管理后台路径前缀
ADMIN_PREFIX = /admin
LOGIN_PATH = /login
# 登录后默认跳转
LOGIN_REDIRECT = /admin
# JWT 写入 Cookie（HttpOnly，供页面会话与同域请求）
ACCESS_COOKIE = ntesterc_access_token
REFRESH_COOKIE = ntesterc_refresh_token
COOKIE_SECURE = False
COOKIE_SAMESITE = lax

[SERVER]
HOST = 127.0.0.1
PORT = 8009
RELOAD = True
WORKERS = 0
LOG_LEVEL = info

[DATABASE]
# sqlite | mysql | postgres
TYPE = postgres
# SQLite 文件路径（相对项目根目录或绝对路径）
SQLITE_PATH = resources/db.sqlite3
HOST = 127.0.0.1
PORT = 5432
USER = postgres
PASSWORD =Rebort
NAME = Ntestercweb
# 非空时覆盖 TYPE/HOST 等拼装结果（同步驱动 URL）
DATABASE_URL =
ECHO = False
# 启动时自动 alembic upgrade
AUTO_UPGRADE = True
# 启动时自动写入种子数据（表为空时）
AUTO_SEED = True

[JWT]
SECRET_KEY = your-jwt-secret-key-here-make-it-long-and-secure
ALGORITHM = HS256
ACCESS_TOKEN_EXPIRE_MINUTES = 30
REFRESH_TOKEN_EXPIRE_DAYS = 7

[LOG]
LEVEL = INFO
FORMAT = text
FILE_ENABLED = False
FILE_PATH = logs/app.log
MAX_SIZE = 10
BACKUP_COUNT = 5
CONSOLE_OUTPUT = True

[CORS]
ORIGINS = ["*"]
METHODS = ["*"]
HEADERS = ["*"]
ALLOW_CREDENTIALS = True
